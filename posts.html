<html lang="en" data-theme="default">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Bilgrandov's learning journal: competitive programming notes, fullstack web development insights, and hands-on project write-ups. Documented as it happens.">
  <meta property="og:title" content="Bilgrandov | Posts & Journal">
  <meta property="og:description" content="Learning journal documented raw and unfiltered. CP, Blog, and dev notes.">
  <meta property="og:image" content="https://bilgrandov.github.io/assets/profile.jpg">
  <meta property="og:url" content="https://bilgrandov.github.io/posts.html">
  <meta property="og:type" content="website">
  <meta name="theme-color" content="#e8650a">
  <title>Bilgrandov | Posts & Journal</title>
    <link rel="manifest" href="manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Bilgrandov">
  <link rel="icon" href="assets/icon.webp" type="image/webp">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=Inter:wght@400;500;600&family=Caveat:wght@400;700&family=Space+Mono:wght@400;700&display=swap">
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js" defer></script>
</head>

<body>
  <div class="nav-overlay" id="nav-overlay"></div>
  <button class="nav-hamburger" id="nav-hamburger" aria-label="Open navigation">☰</button>

  <nav class="side-nav" id="side-nav" aria-label="Main navigation">
    <div class="nav-brand">
      <div class="nav-brand-id">BILGRANDOV / BTC</div>
      <div class="nav-brand-name">Field <span>Notes</span></div>
      <div class="nav-open-badge">Open to Work</div>
    </div>
    <div class="nav-links">
      <a href="index.html" class="nav-link">
        <span class="nav-link-icon">◈</span>
        <span class="nav-link-label">Profile</span>
        <span class="nav-link-no">01</span>
      </a>
      <a href="skills.html" class="nav-link">
        <span class="nav-link-icon">◎</span>
        <span class="nav-link-label">Skills</span>
        <span class="nav-link-no">02</span>
      </a>
      <a href="projects.html" class="nav-link">
        <span class="nav-link-icon">◫</span>
        <span class="nav-link-label">Projects</span>
        <span class="nav-link-no">03</span>
      </a>
      <a href="posts.html" class="nav-link active">
        <span class="nav-link-icon">◻</span>
        <span class="nav-link-label">Posts</span>
        <span class="nav-link-no">04</span>
      </a>
      <a href="contact.html" class="nav-link">
        <span class="nav-link-icon">◌</span>
        <span class="nav-link-label">Contact</span>
        <span class="nav-link-no">05</span>
      </a>
    </div>
    <div class="nav-footer">
      <button class="theme-toggle" id="theme-switcher" title="Toggle dark mode">☀ Light</button>
      <div class="nav-clock" id="taskbar-clock">--:--</div>
    </div>
  </nav>

  <div class="main-content">
    <div class="page-scroll">

      <header class="doc-header doc-header--compact">
        <div class="doc-header-title">
          <div class="doc-eyebrow">Learning Journal</div>
          <h1 class="doc-heading">Learning, documented <em>raw.</em></h1>
        </div>
      </header>

      <main>
        <!-- Posts Explorer layout -->
        <div class="posts-layout">
          <!-- Sidebar: tree -->
          <div class="posts-sidebar">
            <div class="posts-search">
              <input type="text" id="post-search" placeholder="Search posts…" autocomplete="off" name="post-search">
            </div>
            <div class="posts-tree" id="posts-tree">
              <!-- Dynamically populated -->
              <div style="padding: 16px; font-family: var(--font-mono); font-size: 12px; color: var(--text-subtle);">
                Loading…
              </div>
            </div>
          </div>

          <!-- Right: viewer -->
          <div class="posts-viewer" id="post-viewer">

            <!-- Index view -->
            <div class="posts-index" id="explorer-index">
              <div class="section-label" style="margin-bottom: 8px;">All Posts</div>
              <div id="index-posts-list">
                <!-- Dynamically populated -->
              </div>
            </div>

            <!-- Single post view -->
            <div class="post-viewer-pane hidden" id="single-post-view">
              <div class="post-viewer-nav">
                <button id="nav-home" class="btn btn-outline btn-sm">← Back to Posts</button>
              </div>
              <div class="post-viewer-header">
                <h2 class="post-viewer-title" id="view-title">Post Title</h2>
                <div class="post-viewer-meta">
                  <span id="view-date">Date</span>
                  <span>·</span>
                  <span id="view-category">Category</span>
                </div>
              </div>
              <div class="post-viewer-body" id="view-content">
                <!-- Markdown content renders here -->
              </div>
              <div class="post-pagination">
                <button id="nav-prev" class="btn btn-outline btn-sm">◀ Previous</button>
                <button id="nav-next" class="btn btn-outline btn-sm">Next ▶</button>
              </div>
            </div>

          </div>
        </div>
      </main>

      <footer class="page-footer">
        <span><span id="post-count-footer">0</span> posts in the archive | more coming</span>
        <span style="font-family: var(--font-hand); font-size: 14px; color: var(--orange);">thinking out loud ✍</span>
      </footer>
    </div>
  </div>
  <script src="supabase.config.js"></script>
  <script src="script.js" defer></script>
</body>

</html>
